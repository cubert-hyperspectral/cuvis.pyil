name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  meta:
    name: Resolve versions
    runs-on: ubuntu-latest
    outputs:
      sdk: ${{ steps.meta.outputs.sdk }}
      test_matrix: ${{ steps.matrix.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Read pyproject.toml
        id: pyproject
        run: |
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: cubert-hyperspectral/cuvis.docker/.github/actions/release-meta@main
        with:
          version: ${{ steps.pyproject.outputs.version }}

      # A platform the SDK has not shipped has no cuvis_base image; warn and skip it here
      # rather than let every job for it fail on an image that cannot be pulled.
      - name: Select the variants that have a cuvis_base image
        id: matrix
        env:
          SDK: ${{ steps.meta.outputs.sdk }}
        run: python3 .github/scripts/build_matrix.py --sdk "$SDK" >> "$GITHUB_OUTPUT"

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: cubert-hyperspectral/cuvis.docker/.github/actions/changelog@main

      - name: Require a changelog entry
        if: >
          github.event_name == 'pull_request'
          && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
        run: |
          if ! git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx CHANGELOG.md; then
            echo "This pull request does not touch CHANGELOG.md."
            echo "Add an entry under '## [Unreleased]' following CONTRIBUTING.md,"
            echo "or label the pull request 'no-changelog' if the change is genuinely invisible to users."
            exit 1
          fi

  build-and-test:
    name: Build and test (ubuntu${{ matrix.ubuntu }}, py${{ matrix.python }}, ${{ matrix.arch }})
    needs: meta
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.meta.outputs.test_matrix) }}

    runs-on: ${{ matrix.runner }}
    container:
      image: cubertgmbh/cuvis_base:${{ needs.meta.outputs.sdk }}-ubuntu${{ matrix.ubuntu }}${{ matrix.tag_suffix }}
    steps:
      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common gnupg g++ swig cmake

      - name: Add Deadsnakes PPA and install Python ${{ matrix.python }}
        run: |
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python${{ matrix.python }}-dev python${{ matrix.python }}-venv

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python virtual environment
        run: |
          python${{ matrix.python }} -m venv /tmp/venv
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Install Python build dependencies
        run: |
          pip install --upgrade pip setuptools wheel build
          pip install numpy==${{ matrix.numpy }}

      - name: CMake configure and build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DDOXYGEN_BUILD_DOCUMENTATION=FALSE \
                -DPython_ROOT_DIR=/tmp/venv \
                -B build .
          cmake --build build --target cuvis_pyil --config Release

      - name: Copy built files and install package
        run: |
          chmod +x ./copy_pyil_files.sh
          ./copy_pyil_files.sh build

          # Ubuntu 22.04 needs upgraded packaging tools
          if grep -q 'VERSION_ID="22.04"' /etc/os-release; then
            pip install --upgrade pip setuptools wheel build packaging
          fi

          pip install .

      - name: Smoke test - verify import and version
        run: |
          OUTPUT=$(python -c "from cuvis_il import cuvis_il; print(cuvis_il.cuvis_version_swig())")
          echo "Version output: $OUTPUT"
          echo "$OUTPUT" | grep -q "CUBERT SDK" || (echo "Version check failed!" && exit 1)

      - name: Smoke test - symbol introspection
        run: |
          # Meaningful against a matched SDK: proves the extension can report which cuvis
          # functions it needs, and that every one of them is reachable through a Python
          # entry point, which is what lets a missing one raise instead of aborting.
          python -c "
          import cuvis_il
          from cuvis_il import cuvis_il as c
          needed = cuvis_il._needed_symbols()
          assert len(needed) > 100, needed
          unguarded = [n for n in needed if cuvis_il._entry_point_for(n) is None]
          assert not unguarded, unguarded
          print('needs', len(needed), 'cuvis functions; missing:', c.missing_symbols)
          print('built against:', c.built_against_version, '| loaded:', c.library_version)
          # Both sides come from the same banner, so a build that lost the define shows up
          # here rather than as a silent 'unknown' in someone's bug report.
          assert c.built_against_hash and c.library_hash, (c.built_against_version, c.library_version)
          assert c.built_against_hash == c.library_hash, 'CI builds and runs the same SDK'
          "
          SO=$(python -c "from cuvis_il import _cuvis_pyil; print(_cuvis_pyil.__file__)")
          if readelf -d "$SO" | grep -q BIND_NOW; then
            echo "extension is BIND_NOW: lazy binding is defeated, a missing symbol would fail the import"
            exit 1
          fi

  setup-windows-deps:
    name: Download the SDK for Windows
    needs: meta
    runs-on: windows-latest
    steps:
      - name: Cache CUVIS SDK zip
        id: cache-cuvis-zip
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\cuvis_sdk.zip
          key: cuvis-sdk-zip-windows-${{ needs.meta.outputs.sdk }}

      - name: Download CUVIS SDK zip
        if: steps.cache-cuvis-zip.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CUVIS_VERSION: ${{ needs.meta.outputs.sdk }}
        run: |
          $v = $env:CUVIS_VERSION
          $vn = $v -replace '\.', ''
          Invoke-WebRequest "https://cloud.cubert-gmbh.de/s/cuvis_sdk_release_ver_$vn/download" -OutFile cuvis_sdk.zip

  build-and-test-windows:
    name: Build and test (windows, py${{ matrix.python }})
    needs: [meta, setup-windows-deps]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { python: "3.10", numpy: "2.0.0" }
          - { python: "3.11", numpy: "2.0.0" }
          - { python: "3.12", numpy: "2.0.0" }
          - { python: "3.13", numpy: "2.1.0" }
          - { python: "3.14", numpy: "2.3.2" }
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install SWIG 4.2.1
        shell: pwsh
        run: |
          winget install --id SWIG.SWIG --version 4.2.1 --silent --accept-package-agreements --accept-source-agreements
          $swigPkg = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Directory | Where-Object { $_.Name -like "SWIG.SWIG_*" } | Select-Object -First 1
          $swigExe = Get-ChildItem $swigPkg.FullName -Recurse -Filter "swig.exe" | Select-Object -First 1
          echo "SWIG_EXECUTABLE=$($swigExe.FullName)" >> $env:GITHUB_ENV
          echo "SWIG_DIR=$(Join-Path $swigExe.DirectoryName 'Lib')" >> $env:GITHUB_ENV

      - name: Restore CUVIS SDK zip
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\cuvis_sdk.zip
          key: cuvis-sdk-zip-windows-${{ needs.meta.outputs.sdk }}
          fail-on-cache-miss: true

      - name: Trust the Waves driver publisher
        shell: pwsh
        run: |
          # The SDK installer hands its Waves drivers to DPInst, whose catalogs are signed by a
          # publisher no machine trusts by default. DrvInst then raises the "install this device
          # software?" prompt on a desktop nobody is watching and the whole installer waits on it.
          certutil -addstore -f CA "${{ github.workspace }}\.github\driver-certs\globalsign-codesigning-ca-sha256-g3.cer"
          certutil -addstore -f TrustedPublisher "${{ github.workspace }}\.github\driver-certs\avago-technologies-gmbh.cer"

      - name: Install CUVIS SDK
        shell: pwsh
        timeout-minutes: 15
        env:
          CUVIS_VERSION: ${{ needs.meta.outputs.sdk }}
        run: |
          Expand-Archive "${{ github.workspace }}\cuvis_sdk.zip" -DestinationPath cuvis_sdk
          $installer = Get-ChildItem "cuvis_sdk\Cuvis $env:CUVIS_VERSION\" -Recurse -Filter "Cuvis_C_SDK_Installer_*.exe" | Select-Object -First 1
          Write-Output "Installing: $($installer.FullName)"

          $proc = Start-Process $installer.FullName -ArgumentList '/S' -Wait -PassThru
          Write-Output "Installer exit code: $($proc.ExitCode)"

          $cuvisBin = 'C:\Program Files\Cuvis\bin'
          if (-not (Test-Path "$cuvisBin\*.dll")) {
              Write-Output "::error::core CUVIS SDK missing under $cuvisBin"
              exit 1
          }
          Write-Output "CUVIS SDK installed:"; Get-ChildItem $cuvisBin | Select-Object -First 20 | Format-Table -Auto | Out-String | Write-Output

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Create venv and install Python build dependencies
        shell: pwsh
        run: |
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install numpy==${{ matrix.numpy }}

      - name: CMake configure and build
        shell: pwsh
        env:
          CUVIS: C:\Program Files\Cuvis
        run: |
          $env:PATH += ";C:\Program Files\Cuvis\bin"
          cmake "-DCMAKE_BUILD_TYPE=Release" "-DDOXYGEN_BUILD_DOCUMENTATION=FALSE" "-DSWIG_DIR=$env:SWIG_DIR" "-DSWIG_EXECUTABLE=$env:SWIG_EXECUTABLE" "-DPython_ROOT_DIR=${{ github.workspace }}\venv" "-DCMAKE_PREFIX_PATH=$env:CUVIS" -B build .
          cmake --build build --target cuvis_pyil --config Release

      - name: Copy built files and install package
        shell: bash
        run: |
          chmod +x ./copy_pyil_files.sh
          ./copy_pyil_files.sh build/Release
          source venv/Scripts/activate
          pip install .

      - name: Smoke test - verify import and version
        shell: pwsh
        env:
          CUVIS: C:\Program Files\Cuvis\bin
        run: |
          .\venv\Scripts\Activate.ps1
          $output = python -c "from cuvis_il import cuvis_il; print(cuvis_il.cuvis_version_swig())"
          Write-Output "Version output: $output"
          if ($output -notmatch "CUBERT SDK") { Write-Output "Version check failed!"; exit 1 }

      - name: Smoke test - symbol introspection
        shell: pwsh
        env:
          CUVIS: C:\Program Files\Cuvis\bin
        run: |
          .\venv\Scripts\Activate.ps1
          # Meaningful against a matched SDK: proves the extension can report which cuvis
          # functions it needs, and that every one of them is reachable through a Python
          # entry point, which is what lets a missing one raise instead of crashing.
          python -c @"
          import cuvis_il
          from cuvis_il import cuvis_il as c
          needed = cuvis_il._needed_symbols()
          assert len(needed) > 100, needed
          unguarded = [n for n in needed if cuvis_il._entry_point_for(n) is None]
          assert not unguarded, unguarded
          print('needs', len(needed), 'cuvis functions; missing:', c.missing_symbols)
          print('built against:', c.built_against_version, '| loaded:', c.library_version)
          # Both sides come from the same banner, so a build that lost the define shows up
          # here rather than as a silent 'unknown' in someone's bug report.
          assert c.built_against_hash and c.library_hash, (c.built_against_version, c.library_version)
          assert c.built_against_hash == c.library_hash, 'CI builds and runs the same SDK'
          "@
