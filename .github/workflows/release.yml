name: Release

# Pushing a vGENERATION.MAJOR.MINOR.PATCH tag on main releases that commit: wheels to TestPyPI,
# then PyPI, then the cubertgmbh/cuvis_pyil image, then a GitHub Release.
# A pre-release tag (v3.6.0.0rc1) does the same but creates no GitHub Release.
on:
  push:
    tags: ['v*.*.*.*']

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sdk: ${{ steps.meta.outputs.sdk }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      wheel_matrix: ${{ steps.matrix.outputs.wheel_matrix }}
      image_matrix: ${{ steps.matrix.outputs.image_matrix }}
      image_tags: ${{ steps.matrix.outputs.image_tags }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read pyproject.toml
        id: pyproject
        run: |
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: cubert-hyperspectral/cuvis.docker/.github/actions/release-meta@main
        with:
          version: ${{ steps.pyproject.outputs.version }}
          tag: ${{ github.ref_name }}

      - uses: cubert-hyperspectral/cuvis.docker/.github/actions/tag-on-main@main

      - uses: cubert-hyperspectral/cuvis.docker/.github/actions/changelog@main
        with:
          version: ${{ steps.meta.outputs.base_version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}

      - name: Verify the version is not published yet
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          version = os.environ["VERSION"]
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/cuvis-il/json") as response:
                  released = json.load(response)["releases"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              released = {}

          if released.get(version):
              sys.exit(
                  f"cuvis-il=={version} is already on PyPI and cannot be replaced. "
                  "Bump PATCH, move the CHANGELOG.md section, and tag again."
              )
          print(f"cuvis-il=={version} is not published yet.")
          PY

      # A pre-release SDK may lack some cuvis_base variants (typically Jetson); those wheels
      # and images are skipped with a warning. A final release needs all of them.
      - name: Select the variants that have a cuvis_base image
        id: matrix
        env:
          SDK: ${{ steps.meta.outputs.sdk }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          STRICT=$([ "$PRERELEASE" = true ] || echo --strict)
          python3 .github/scripts/build_matrix.py --sdk "$SDK" $STRICT >> "$GITHUB_OUTPUT"

  build:
    name: Build wheels (ubuntu${{ matrix.ubuntu }}, py${{ matrix.python }}, ${{ matrix.arch }})
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.wheel_matrix) }}

    runs-on: ${{ matrix.runner }}
    container:
      image: cubertgmbh/cuvis_base:${{ needs.validate.outputs.sdk }}-ubuntu${{ matrix.ubuntu }}${{ matrix.tag_suffix }}

    steps:
      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common gnupg g++ swig cmake

      - name: Add Deadsnakes PPA and install Python ${{ matrix.python }}
        run: |
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python${{ matrix.python }}-dev python${{ matrix.python }}-venv

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python virtual environment
        run: |
          python${{ matrix.python }} -m venv /tmp/venv
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Install Python build dependencies
        run: |
          pip install --upgrade pip setuptools wheel build
          pip install numpy==${{ matrix.numpy }}

      - name: CMake configure and build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DDOXYGEN_BUILD_DOCUMENTATION=FALSE \
                -DPython_ROOT_DIR=/tmp/venv \
                -B build .
          cmake --build build --target cuvis_pyil --config Release

      - name: Copy built files and package wheel
        run: |
          rm -rf ./cuvis_il/*cuvis*
          rm -rf ./dist/*.whl

          chmod +x ./copy_pyil_files.sh
          ./copy_pyil_files.sh build

          python -m build --wheel --no-isolation

      - name: Tag wheel with correct Python and platform tags
        run: |
          PYTHON_TAG="py$(echo '${{ matrix.python }}' | tr -d '.')"
          WHEELS=$(find dist -type f -name "*.whl")
          WHEEL_COUNT=$(echo "$WHEELS" | wc -l)
          if [ "$WHEEL_COUNT" -ne 1 ]; then
            echo "Expected exactly 1 wheel, found $WHEEL_COUNT"
            exit 1
          fi
          echo "Tagging $WHEELS with --python-tag=$PYTHON_TAG --platform-tag=${{ matrix.platform_tag }}"
          python -m wheel tags --remove \
            --python-tag="$PYTHON_TAG" \
            --platform-tag=${{ matrix.platform_tag }} \
            "$WHEELS"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-ubuntu${{ matrix.ubuntu }}-py${{ matrix.python }}-${{ matrix.arch }}
          path: dist/*.whl

  setup-windows-deps:
    name: Download the SDK for Windows
    needs: validate
    runs-on: windows-latest
    steps:
      - name: Cache CUVIS SDK zip
        id: cache-cuvis-zip
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\cuvis_sdk.zip
          key: cuvis-sdk-zip-windows-${{ needs.validate.outputs.sdk }}

      - name: Download CUVIS SDK zip
        if: steps.cache-cuvis-zip.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CUVIS_VERSION: ${{ needs.validate.outputs.sdk }}
        run: |
          $v = $env:CUVIS_VERSION
          $vn = $v -replace '\.', ''
          Invoke-WebRequest "https://cloud.cubert-gmbh.de/s/cuvis_sdk_release_ver_$vn/download" -OutFile cuvis_sdk.zip

  build-windows:
    name: Build wheels (windows, py${{ matrix.python }})
    needs: [validate, setup-windows-deps]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { python: "3.10", numpy: "2.0.0" }
          - { python: "3.11", numpy: "2.0.0" }
          - { python: "3.12", numpy: "2.0.0" }
          - { python: "3.13", numpy: "2.1.0" }
          - { python: "3.14", numpy: "2.3.2" }
    runs-on: windows-latest

    steps:
      - name: Install SWIG 4.2.1
        shell: pwsh
        run: |
          winget install --id SWIG.SWIG --version 4.2.1 --silent --accept-package-agreements --accept-source-agreements
          $swigPkg = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Directory | Where-Object { $_.Name -like "SWIG.SWIG_*" } | Select-Object -First 1
          $swigExe = Get-ChildItem $swigPkg.FullName -Recurse -Filter "swig.exe" | Select-Object -First 1
          echo "SWIG_EXECUTABLE=$($swigExe.FullName)" >> $env:GITHUB_ENV
          echo "SWIG_DIR=$(Join-Path $swigExe.DirectoryName 'Lib')" >> $env:GITHUB_ENV

      - name: Restore CUVIS SDK zip
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}\cuvis_sdk.zip
          key: cuvis-sdk-zip-windows-${{ needs.validate.outputs.sdk }}
          fail-on-cache-miss: true

      - name: Install CUVIS SDK
        shell: pwsh
        env:
          CUVIS_VERSION: ${{ needs.validate.outputs.sdk }}
        run: |
          $v = $env:CUVIS_VERSION
          Expand-Archive "${{ github.workspace }}\cuvis_sdk.zip" -DestinationPath cuvis_sdk
          $installer = Get-ChildItem "cuvis_sdk\Cuvis $v\" -Recurse -Filter "Cuvis_C_SDK_Installer_*.exe" | Select-Object -First 1
          Write-Output "Installing: $($installer.FullName)"

          $logDir = Join-Path $env:RUNNER_TEMP 'cuvis_install'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $nsisLog  = Join-Path $logDir 'install.log'
          $cuvisDir = 'C:\Program Files\Cuvis'
          $cuvisBin = Join-Path $cuvisDir 'bin'

          # WORKAROUND for a bug in the current Cuvis_C_SDK_Installer (NSIS): $SILENT is never set under /S,
          # so its bundled runtime driver MSIs (C:\Program Files\Cuvis\Runtime\*.msi, e.g. WavesSetup222.msi)
          # launch via `msiexec /i ... /passive` instead of /quiet. /passive pops a GUI that nobody dismisses
          # on a headless runner, so the installer's ExecWait hangs forever. We kill those stuck interactive
          # msiexec processes so the installer finishes, then re-install the runtime MSIs ourselves with /qn.
          # Those driver components are secondary -> their failure must not fail the job.
          # Upstream fix for future installer versions: branch the runtime-MSI calls on ${Silent}, use /quiet.
          $proc = Start-Process $installer.FullName -ArgumentList '/S', "/LOG=$nsisLog", '/NORESTART' -PassThru
          $timeoutSec = 600; $elapsed = 0; $grace = 20; $firstSeen = @{}
          while (-not $proc.HasExited -and $elapsed -lt $timeoutSec) {
              Start-Sleep -Seconds 10; $elapsed += 10
              Get-CimInstance Win32_Process | Where-Object {
                  $_.Name -eq 'msiexec.exe' -and $_.CommandLine -and
                  $_.CommandLine -match 'Cuvis' -and $_.CommandLine -match '\.msi' -and $_.CommandLine -notmatch '/q' } |
                ForEach-Object {
                  if (-not $firstSeen.ContainsKey($_.ProcessId)) {
                      $firstSeen[$_.ProcessId] = $elapsed
                      Write-Output "Detected interactive runtime sub-installer (PID $($_.ProcessId)): $($_.CommandLine)"
                  } elseif ($elapsed - $firstSeen[$_.ProcessId] -ge $grace) {
                      Write-Output "Killing stuck sub-installer PID $($_.ProcessId) so the main installer can continue."
                      Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
                  }
                }
              Write-Output "== t=${elapsed}s : installer running =="
          }

          if ($proc.HasExited) { Write-Output "Installer exit code: $($proc.ExitCode)" }
          else { Write-Output "::warning::Installer still running at ${timeoutSec}s - terminating."; Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }

          if (-not (Test-Path "$cuvisBin\*.dll")) {
              Write-Output "::error::core CUVIS SDK missing under $cuvisBin"
              if (Test-Path $nsisLog) { Write-Output '----- NSIS install.log -----'; Get-Content $nsisLog }
              exit 1
          }

          Get-ChildItem (Join-Path $cuvisDir 'Runtime') -Filter *.msi -ErrorAction SilentlyContinue | ForEach-Object {
              $msiLog = Join-Path $logDir ($_.BaseName + '.log')
              $p = Start-Process msiexec -Wait -PassThru -ArgumentList '/i', "`"$($_.FullName)`"", '/qn', '/norestart', '/l*v', "`"$msiLog`""
              Write-Output "Runtime component $($_.Name) -> msiexec exit $($p.ExitCode)"
          }

          Write-Output "CUVIS SDK installed:"; Get-ChildItem $cuvisBin | Select-Object -First 20 | Format-Table -Auto | Out-String | Write-Output

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Create venv and install Python build dependencies
        shell: pwsh
        run: |
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          python -m pip install --upgrade pip setuptools wheel build
          python -m pip install numpy==${{ matrix.numpy }}

      - name: CMake configure and build
        shell: pwsh
        env:
          CUVIS: C:\Program Files\Cuvis
        run: |
          $env:PATH += ";C:\Program Files\Cuvis\bin"
          cmake "-DCMAKE_BUILD_TYPE=Release" "-DDOXYGEN_BUILD_DOCUMENTATION=FALSE" "-DSWIG_DIR=$env:SWIG_DIR" "-DSWIG_EXECUTABLE=$env:SWIG_EXECUTABLE" "-DPython_ROOT_DIR=${{ github.workspace }}\venv" "-DCMAKE_PREFIX_PATH=$env:CUVIS" -B build .
          cmake --build build --target cuvis_pyil --config Release

      - name: Copy built files and package wheel
        shell: bash
        run: |
          rm -rf ./cuvis_il/*cuvis*
          rm -rf ./dist/*.whl
          chmod +x ./copy_pyil_files.sh
          ./copy_pyil_files.sh build/Release
          source venv/Scripts/activate
          python -m build --wheel --no-isolation

      - name: Tag wheel with correct Python and platform tags
        shell: bash
        run: |
          source venv/Scripts/activate
          PYTHON_TAG="py$(echo '${{ matrix.python }}' | tr -d '.')"
          WHEELS=$(find dist -type f -name "*.whl")
          WHEEL_COUNT=$(echo "$WHEELS" | wc -l)
          if [ "$WHEEL_COUNT" -ne 1 ]; then
            echo "Expected exactly 1 wheel, found $WHEEL_COUNT"
            exit 1
          fi
          echo "Tagging $WHEELS with --python-tag=$PYTHON_TAG --platform-tag=win_amd64"
          python -m wheel tags --remove \
            --python-tag="$PYTHON_TAG" \
            --platform-tag=win_amd64 \
            "$WHEELS"

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python }}
          path: dist/*.whl

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [validate, build, build-windows]
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh dist/

      - uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Confirm the version is downloadable from TestPyPI
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python3 -m pip download --no-deps --dest /tmp/smoke \
                --index-url https://test.pypi.org/simple/ \
                "cuvis-il==${VERSION}"; then
              ls -lh /tmp/smoke
              exit 0
            fi
            echo "Not indexed yet, retrying in 30s (attempt ${attempt}/6)."
            sleep 30
          done
          echo "cuvis-il==${VERSION} never appeared on TestPyPI."
          exit 1

  publish-pypi:
    name: Publish to PyPI
    needs: [validate, publish-testpypi]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@v1.13.0

  docker-image:
    name: Build and push image (${{ matrix.arch }})
    needs: [validate, publish-pypi]
    runs-on: ${{ matrix.runner }}
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.validate.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-ubuntu*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/bake-action@v7
        env:
          CUVIS_VERSION: ${{ needs.validate.outputs.sdk }}
          CUVIS_IL_VERSION: ${{ needs.validate.outputs.version }}
        with:
          source: .
          files: docker-bake.hcl
          targets: ${{ matrix.targets }}
          push: true

  smoke:
    name: Pull and inspect image
    needs: [validate, docker-image]
    runs-on: ubuntu-latest
    steps:
      - name: Every pushed tag resolves and the amd64 ones carry this release
        env:
          TAGS: ${{ needs.validate.outputs.image_tags }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for image in $TAGS; do
            docker manifest inspect "$image" > /dev/null
            case "$image" in
              *-arm64) echo "$image: manifest ok" ;;
              *) docker run --rm "$image" pip show cuvis_il | grep -x "Version: ${VERSION}" ;;
            esac
          done

  github-release:
    name: Create GitHub release
    needs: [validate, smoke]
    if: needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - id: notes
        uses: cubert-hyperspectral/cuvis.docker/.github/actions/changelog@main
        with:
          mode: extract
          version: ${{ needs.validate.outputs.version }}

      - uses: softprops/action-gh-release@v2
        with:
          name: cuvis-il ${{ needs.validate.outputs.version }}
          body: ${{ steps.notes.outputs.body }}
          files: dist/*.whl
          draft: false
          prerelease: false
