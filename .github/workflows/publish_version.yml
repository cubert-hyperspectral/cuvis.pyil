name: Build & Publish cuvis.pyil

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      repository:
        description: "Target index"
        type: choice
        options: [pypi, testpypi]
        default: testpypi
      ref:
        description: "Git ref to build (branch/tag/SHA)"
        required: false
        default: ""
      cuvis_version:
        description: "CUVIS SDK version for Docker base image (e.g. 3.5.3) — required when ref is a branch, not a version tag"
        required: false
        default: ""

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:

  prepare:
    runs-on: ubuntu-latest
    environment: release-gate
    outputs:
      cuvis_version: ${{ steps.tag.outputs.cuvis_version }}
    steps:
      - name: Parse SDK version
        id: tag
        run: |
          TAG="${{ inputs.ref || github.ref_name }}"
          CUVIS_VERSION="${{ inputs.cuvis_version }}"
          if [ -z "$CUVIS_VERSION" ]; then
            CUVIS_VERSION="${TAG#v}"
          fi
          echo "cuvis_version=$CUVIS_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["22.04", "24.04"]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        arch:   ["amd64", "arm64"]
        include:
          # numpy pinned per python version
          - { python: "3.9",  numpy: "2.0.0" }
          - { python: "3.10", numpy: "2.0.0" }
          - { python: "3.11", numpy: "2.0.0" }
          - { python: "3.12", numpy: "2.0.0" }
          - { python: "3.13", numpy: "2.1.0" }
          - { python: "3.14", numpy: "2.3.2" }
          # runner + tag_suffix per arch (arm runner label is ubuntu-version-specific)
          - { arch: "amd64",                   runner: "ubuntu-latest",    tag_suffix: ""       }
          - { ubuntu: "22.04", arch: "arm64",  runner: "ubuntu-22.04-arm", tag_suffix: "-arm64" }
          - { ubuntu: "24.04", arch: "arm64",  runner: "ubuntu-24.04-arm", tag_suffix: "-arm64" }
          # platform tag per ubuntu+arch combination
          - { ubuntu: "22.04", arch: "amd64", platform_tag: "manylinux_2_35_x86_64"  }
          - { ubuntu: "24.04", arch: "amd64", platform_tag: "manylinux_2_39_x86_64"  }
          - { ubuntu: "22.04", arch: "arm64", platform_tag: "manylinux_2_35_aarch64" }
          - { ubuntu: "24.04", arch: "arm64", platform_tag: "manylinux_2_39_aarch64" }

    runs-on: ${{ matrix.runner }}
    container:
      image: cubertgmbh/cuvis_base:${{ needs.prepare.outputs.cuvis_version }}-ubuntu${{ matrix.ubuntu }}${{ matrix.tag_suffix }}

    permissions:
      contents: read

    steps:
      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y software-properties-common gnupg g++ swig cmake

      - name: Add Deadsnakes PPA and install Python ${{ matrix.python }}
        run: |
          add-apt-repository -y ppa:deadsnakes/ppa
          apt-get update
          apt-get install -y python${{ matrix.python }}-dev python${{ matrix.python }}-venv

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Set up Python virtual environment
        run: |
          python${{ matrix.python }} -m venv /tmp/venv
          echo "/tmp/venv/bin" >> "$GITHUB_PATH"

      - name: Install Python build dependencies
        run: |
          pip install --upgrade pip setuptools wheel build
          pip install numpy==${{ matrix.numpy }}

      - name: CMake configure and build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DDOXYGEN_BUILD_DOCUMENTATION=FALSE \
                -DPython_ROOT_DIR=/tmp/venv \
                -B build .
          cmake --build build --target cuvis_pyil --config Release

      - name: Copy built files and package wheel
        run: |
          rm -rf ./cuvis_il/*cuvis*
          rm -rf ./dist/*.whl

          chmod +x ./copy_pyil_files.sh
          ./copy_pyil_files.sh build

          python -m build --wheel --no-isolation

      - name: Tag wheel with correct Python and platform tags
        run: |
          PYTHON_TAG="py$(echo '${{ matrix.python }}' | tr -d '.')"
          WHEELS=$(find dist -type f -name "*.whl")
          WHEEL_COUNT=$(echo "$WHEELS" | wc -l)
          if [ "$WHEEL_COUNT" -ne 1 ]; then
            echo "Expected exactly 1 wheel, found $WHEEL_COUNT"
            exit 1
          fi
          echo "Tagging $WHEELS with --python-tag=$PYTHON_TAG --platform-tag=${{ matrix.platform_tag }}"
          python -m wheel tags --remove \
            --python-tag="$PYTHON_TAG" \
            --platform-tag=${{ matrix.platform_tag }} \
            "$WHEELS"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-ubuntu${{ matrix.ubuntu }}-py${{ matrix.python }}-${{ matrix.arch }}
          path: dist/*.whl

  setup-windows-deps:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Cache CUVIS SDK
        id: cache-cuvis
        uses: actions/cache@v4
        with:
          path: C:\Program Files\Cuvis
          key: cuvis-sdk-windows-${{ needs.prepare.outputs.cuvis_version }}

      - name: Download and install CUVIS SDK
        if: steps.cache-cuvis.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          CUVIS_VERSION: ${{ needs.prepare.outputs.cuvis_version }}
        run: |
          $v = $env:CUVIS_VERSION
          $vn = $v -replace '\.', ''
          Invoke-WebRequest "https://cloud.cubert-gmbh.de/s/cuvis_sdk_release_ver_$vn/download" -OutFile cuvis_sdk.zip
          Expand-Archive cuvis_sdk.zip -DestinationPath cuvis_sdk
          $installer = Get-ChildItem "cuvis_sdk\Cuvis $v\" -Recurse -Filter "Cuvis_C_SDK_Installer_*.exe" | Select-Object -First 1
          Write-Output "Installing: $($installer.FullName)"

          $logDir = Join-Path $env:RUNNER_TEMP 'cuvis_install'
          New-Item -ItemType Directory -Force -Path $logDir | Out-Null
          $nsisLog = Join-Path $logDir 'install.log'
          $cuvisBin = 'C:\Program Files\Cuvis\bin'

          # The installer silently runs the bundled Allied Vision VimbaX GigE-driver sub-installer.
          # On a headless runner that sub-install leaves an orphan msiexec holding the pipe handle,
          # so the NSIS ExecWait never returns and the installer process hangs forever -- even though
          # the SDK files DO land on disk. So we wait for the installed files to appear (not for the
          # process to exit), then terminate the stuck installer and continue.
          $proc = Start-Process $installer.FullName -ArgumentList '/S', "/LOG=$nsisLog", '/NORESTART' -PassThru
          $timeoutSec = 600; $elapsed = 0; $installed = $false
          while ($elapsed -lt $timeoutSec) {
              if (Test-Path "$cuvisBin\*.dll") { $installed = $true; break }
              if ($proc.HasExited) { break }
              Start-Sleep -Seconds 15; $elapsed += 15
              Write-Output "== t=${elapsed}s : waiting for SDK files (binExists=$(Test-Path $cuvisBin)) =="
              Get-CimInstance Win32_Process |
                  Where-Object { $_.Name -match 'setup|install|msiexec|vimba|ebus|vc_redist|cuda|nvidia' } |
                  Select-Object ProcessId, ParentProcessId, Name | Format-Table -Auto | Out-String | Write-Output
          }

          if (-not $installed) { Start-Sleep -Seconds 5; $installed = [bool](Test-Path "$cuvisBin\*.dll") }

          if (-not $proc.HasExited) {
              Write-Output "Installer process still running (known VimbaX/msiexec ExecWait hang) - terminating it."
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          } else {
              Write-Output "Installer exit code: $($proc.ExitCode)"
          }

          # Verify before the cache post-step runs, so a partial install can't poison the cache:
          if (-not $installed) {
              Write-Output "::error::CUVIS SDK files did not appear under $cuvisBin within $timeoutSec s"
              if (Test-Path $nsisLog) { Write-Output '----- NSIS install.log -----'; Get-Content $nsisLog }
              exit 1
          }
          Write-Output "CUVIS SDK installed:"; Get-ChildItem $cuvisBin | Select-Object -First 20 | Format-Table -Auto | Out-String | Write-Output

  build-windows:
    needs: [prepare, setup-windows-deps]
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { python: "3.9",  numpy: "2.0.0" }
          - { python: "3.10", numpy: "2.0.0" }
          - { python: "3.11", numpy: "2.0.0" }
          - { python: "3.12", numpy: "2.0.0" }
          - { python: "3.13", numpy: "2.1.0" }
          - { python: "3.14", numpy: "2.3.2" }
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Install SWIG 4.2.1
        shell: pwsh
        run: |
          winget install --id SWIG.SWIG --version 4.2.1 --silent --accept-package-agreements --accept-source-agreements
          $swigPkg = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Directory | Where-Object { $_.Name -like "SWIG.SWIG_*" } | Select-Object -First 1
          $swigExe = Get-ChildItem $swigPkg.FullName -Recurse -Filter "swig.exe" | Select-Object -First 1
          echo "SWIG_EXECUTABLE=$($swigExe.FullName)" >> $env:GITHUB_ENV
          echo "SWIG_DIR=$(Join-Path $swigExe.DirectoryName 'Lib')" >> $env:GITHUB_ENV

      - name: Restore CUVIS SDK cache
        uses: actions/cache@v4
        with:
          path: C:\Program Files\Cuvis
          key: cuvis-sdk-windows-${{ needs.prepare.outputs.cuvis_version }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive

      - name: Setup Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Create venv and install Python build dependencies
        shell: pwsh
        run: |
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          pip install --upgrade pip setuptools wheel build
          pip install numpy==${{ matrix.numpy }}

      - name: CMake configure and build
        shell: pwsh
        run: |
          cmake "-DCMAKE_BUILD_TYPE=Release" "-DDOXYGEN_BUILD_DOCUMENTATION=FALSE" "-DSWIG_DIR=$env:SWIG_DIR" "-DSWIG_EXECUTABLE=$env:SWIG_EXECUTABLE" "-DPython_ROOT_DIR=${{ github.workspace }}\venv" -B build .
          cmake --build build --target cuvis_pyil --config Release

      - name: Copy built files and package wheel
        shell: bash
        run: |
          rm -rf ./cuvis_il/*cuvis*
          rm -rf ./dist/*.whl
          chmod +x ./copy_pyil_files.sh
          ./copy_pyil_files.sh build/Release
          source venv/Scripts/activate
          python -m build --wheel --no-isolation

      - name: Tag wheel with correct Python and platform tags
        shell: bash
        run: |
          source venv/Scripts/activate
          PYTHON_TAG="py$(echo '${{ matrix.python }}' | tr -d '.')"
          WHEELS=$(find dist -type f -name "*.whl")
          WHEEL_COUNT=$(echo "$WHEELS" | wc -l)
          if [ "$WHEEL_COUNT" -ne 1 ]; then
            echo "Expected exactly 1 wheel, found $WHEEL_COUNT"
            exit 1
          fi
          echo "Tagging $WHEELS with --python-tag=$PYTHON_TAG --platform-tag=win_amd64"
          python -m wheel tags --remove \
            --python-tag="$PYTHON_TAG" \
            --platform-tag=win_amd64 \
            "$WHEELS"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python }}
          path: dist/*.whl

  preflight:
      needs: [prepare, build, build-windows]
      runs-on: ubuntu-latest

      permissions:
        contents: read

      steps:
        - name: Checkout (for pyproject.toml)
          uses: actions/checkout@v4
          with:
            ref: ${{ inputs.ref || github.ref }}

        - name: Read package name/version
          id: meta
          run: |
            python3 - <<'PY'
            import os, sys
            try:
              import tomllib
            except ModuleNotFoundError:
              import tomli as tomllib

            with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)
            proj = data["project"]
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"name={proj['name']}\n")
              f.write(f"version={proj['version']}\n")
            PY
        - name: Abort if version already exists on target index
          env:
            NAME: ${{ steps.meta.outputs.name }}
            VERSION: ${{ steps.meta.outputs.version }}
            TARGET: ${{ inputs.repository || 'pypi' }}
          run: |
            python3 - <<'PY'
            import json, os, sys, urllib.request, urllib.error

            name = os.environ["NAME"]
            version = os.environ["VERSION"]
            target = os.environ["TARGET"]

            base = "https://pypi.org/pypi" if target == "pypi" else "https://test.pypi.org/pypi"
            url = f"{base}/{name}/json"

            try:
              with urllib.request.urlopen(url) as resp:
                data = json.load(resp)
            except urllib.error.HTTPError as e:
              if e.code == 404:
                print(f"{name} not found on {target}; OK to publish {version}.")
                sys.exit(0)
              raise

            releases = data.get("releases", {})
            if version in releases and releases[version]:
              print(f"Version {name}=={version} already exists on {target}. Aborting.")
              sys.exit(1)

            print(f"Version {name}=={version} not present on {target}; OK to publish.")
            PY

  # ── Publish (trusted publishing via OIDC) ──
  publish:
    needs: [prepare, build, preflight]
    runs-on: ubuntu-latest

    environment: ${{ inputs.repository || 'pypi' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels to publish
        run: ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.13.0
        with:
          packages-dir: dist/
          repository-url: >-
            ${{
              github.event_name == 'release'
              && 'https://upload.pypi.org/legacy/'
              || (inputs.repository == 'pypi'
                  && 'https://upload.pypi.org/legacy/'
                  || 'https://test.pypi.org/legacy/')
            }}
